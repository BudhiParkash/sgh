# /etc/nginx/sites-available/shivanshigaming.conf
# Cloudflare (Full strict TLS) → Nginx → Next.js (:3000) and Express API (:4000).
# Only Cloudflare may connect: enforced by the AWS security group AND the allow-list include below.

upstream sgh_web { server 127.0.0.1:3000; keepalive 32; }
upstream sgh_api { server 127.0.0.1:4000; keepalive 32; }

# Real visitor IP from Cloudflare (file generated by scripts/update-cloudflare-ips.sh)
include /etc/nginx/cloudflare-realip.conf;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=sgh_api_post:10m rate=10r/s;

# Redirect plain HTTP and www → https://shivanshigaming.com
server {
  listen 80;
  listen [::]:80;
  server_name shivanshigaming.com www.shivanshigaming.com;
  return 301 https://shivanshigaming.com$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.shivanshigaming.com;
  ssl_certificate     /etc/ssl/cloudflare/origin.pem;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  return 301 https://shivanshigaming.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name shivanshigaming.com;

  ssl_certificate     /etc/ssl/cloudflare/origin.pem;      # Cloudflare Origin Certificate (15 years)
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;  # Authenticated Origin Pulls
  ssl_verify_client on;

  include /etc/nginx/cloudflare-allow.conf;  # allow <cf ranges>; deny all;

  server_tokens off;
  client_max_body_size 100k;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Request-Id $request_id;
  proxy_read_timeout 30s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Admin media uploads (8 MB files)
  location = /api/v1/admin/media { client_max_body_size 10m; proxy_pass http://sgh_api; }
  location ~ ^/api/v1/admin/media/[a-f0-9]{24}/replace$ { client_max_body_size 10m; proxy_pass http://sgh_api; }

  # API docs are not exposed in production
  location /api/v1/docs { return 404; }
  location /api/v1/openapi.json { return 404; }

  # Public form POSTs get an extra burst limit (the API also rate-limits)
  location ~ ^/api/v1/(feedback|contact|reports|privacy-requests|sensitivity/codes/submit)$ {
    limit_req zone=sgh_api_post burst=20 nodelay;
    proxy_pass http://sgh_api;
  }

  location /api/ { proxy_pass http://sgh_api; }

  # MCP server for AI assistants (Claude, ChatGPT) + its OAuth 2.1 endpoints — served by Express.
  location = /mcp { client_max_body_size 2m; proxy_buffering off; proxy_read_timeout 120s; proxy_pass http://sgh_api; }
  location ~ ^/(authorize|token|register|revoke)$ {
    limit_req zone=sgh_api_post burst=20 nodelay;
    proxy_pass http://sgh_api;
  }
  location /oauth/ { proxy_pass http://sgh_api; }
  location ~ ^/\.well-known/oauth-(authorization-server|protected-resource) { proxy_pass http://sgh_api; }

  location /_next/static/ {
    proxy_pass http://sgh_web;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / { proxy_pass http://sgh_web; }
}
