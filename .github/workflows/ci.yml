name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit & API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run typecheck
      - name: Shared + frontend unit tests
        run: pnpm --filter @sgh/shared --filter @sgh/frontend run test
      - name: Backend integration tests (real MongoDB in-memory + Redis service)
        run: pnpm --filter @sgh/backend run test
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - name: Dependency audit (production deps)
        run: pnpm audit --prod --audit-level=high

  e2e:
    name: End-to-end (Playwright) + Lighthouse budgets
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 40
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      E2E_MONGODB_URI: mongodb://127.0.0.1:27017/sgh_e2e
      E2E_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sgh/frontend exec playwright install --with-deps chromium
      - name: Playwright (public, mobile, admin flows against a disposable stack)
        run: pnpm --filter @sgh/frontend run test:e2e
        env:
          CI: "true"
      - name: Lighthouse CI (mobile budgets)
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=infrastructure/lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
